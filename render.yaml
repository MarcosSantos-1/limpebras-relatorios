services:
  - type: web
    name: relatorios-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: sao-paulo
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true

