# fly.toml app configuration file

app = "limpebras-relatorios"
primary_region = "gru"  # São Paulo

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/"

[[processes]]
  name = "app"
  cmd = "npm start"

